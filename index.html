<style>
:root{--ink:#1c2430;--sub:#5b6673;--line:#e4e7ec;--bg:#fbfaf8;--accent:#1d5c4d;--accent-soft:#eaf3f0;--card:#fff}
@media (prefers-color-scheme:dark){:root{--ink:#e8ecf1;--sub:#9aa6b4;--line:#2a323d;--bg:#12161c;--accent:#6fbfa6;--accent-soft:#1b2a27;--card:#1a2029}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
     background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;
     display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(100%,420px);background:var(--card);border:1px solid var(--line);border-radius:14px;
      padding:34px 30px;text-align:center}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:30px;letter-spacing:-.01em}
.sub{color:var(--sub);font-size:14px;margin:6px 0 26px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:16px;
      background:var(--bg);color:var(--ink);outline:none}
input:focus{border-color:var(--accent)}
button{border:0;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;
       background:var(--accent);color:#fff}
button:disabled{opacity:.55;cursor:default}
.msg{min-height:22px;margin-top:14px;font-size:13.5px;color:var(--sub)}
.msg.err{color:#b3423a}
.lock{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
      display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:19px}
</style>
</head>
<body>
<div class="card">
  <div class="lock">&#128274;</div>
  <h1>40 Montana Lane</h1>
  <div class="sub">This gallery is private. Enter the password you were given.</div>
  <form id="f" class="row">
    <input id="pw" type="password" autocomplete="current-password" enterkeyhint="go"
           placeholder="Password" aria-label="Password" autofocus>
    <button id="go" type="submit">Unlock</button>
  </form>
  <div class="msg" id="msg"></div>
</div>
<script>
(function () {
  var ITER = 600000;
  var msg = document.getElementById('msg');
  var pw = document.getElementById('pw');
  var go = document.getElementById('go');
  var payload = null;

  function say(t, err) { msg.textContent = t; msg.className = 'msg' + (err ? ' err' : ''); }

  if (!(window.crypto && crypto.subtle)) {
    say('This page must be opened from its https:// link.', true);
    go.disabled = true;
    return;
  }

  // fetch the encrypted gallery in the background while the password is typed
  var fetched = fetch('content.enc?v=' + Date.now()).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var total = +r.headers.get('content-length') || 0;
    if (!r.body || !total) return r.arrayBuffer();
    var reader = r.body.getReader(), chunks = [], got = 0;
    function pump() {
      return reader.read().then(function (x) {
        if (x.done) {
          var all = new Uint8Array(got), off = 0;
          chunks.forEach(function (c) { all.set(c, off); off += c.length; });
          return all.buffer;
        }
        chunks.push(x.value); got += x.value.length;
        if (!unlocking) say('Loading photos… ' + Math.round(got / total * 100) + '%');
        return pump();
      });
    }
    return pump();
  }).then(function (buf) { payload = new Uint8Array(buf); if (!unlocking) say(''); return payload; });
  fetched.catch(function () { say('Could not load the gallery data. Check your connection and refresh.', true); });

  var unlocking = false;
  function deriveKey(password, salt) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', hash: 'SHA-256', salt: salt, iterations: ITER },
          base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      });
  }
  function decryptWith(key, data) {
    var iv = data.subarray(16, 28), ct = data.subarray(28);
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
  }
  function reveal(buf) {
    var html = new TextDecoder().decode(buf);
    document.open(); document.write(html); document.close();
  }

  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    if (unlocking) return;
    var p = pw.value;
    if (!p) { say('Enter the password.', true); return; }
    unlocking = true; go.disabled = true; say('Unlocking…');
    fetched.then(function (data) {
      return deriveKey(p, data.subarray(0, 16)).then(function (key) {
        return decryptWith(key, data).then(function (buf) {
          // remember the derived key for this tab so a refresh doesn't re-ask
          crypto.subtle.exportKey('raw', key).then(function (raw) {
            try {
              var hex = Array.prototype.map.call(new Uint8Array(raw), function (b) {
                return ('0' + b.toString(16)).slice(-2);
              }).join('');
              sessionStorage.setItem('mk', hex);
            } catch (err) {}
            reveal(buf);
          }, function () { reveal(buf); });
        });
      });
    }).catch(function () {
      unlocking = false; go.disabled = false;
      say("That password isn't right — check for typos and try again.", true);
      pw.select();
    });
  });

  // same-tab refresh: try the cached key silently
  try {
    var hex = sessionStorage.getItem('mk');
    if (hex && hex.length === 64) {
      var raw = new Uint8Array(32);
      for (var i = 0; i < 32; i++) raw[i] = parseInt(hex.substr(i * 2, 2), 16);
      crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['decrypt']).then(function (key) {
        fetched.then(function (data) {
          decryptWith(key, data).then(reveal, function () { sessionStorage.removeItem('mk'); });
        });
      });
    }
  } catch (err) {}
})();
</script>
</body>
</html>
